<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robbie's E-Ink Boards</title>
<meta name="description" content="墨水屏看板固件安装入口：行情、天气、食谱">
<style>
  :root {
    --paper: #F3F1EA; --card: #FFFFFF; --ink: #121212; --ink-2: #4A4A47; --ink-3: #6E6D68;
    --rule: #DEDBD1; --red: #C4161C; --red-dark: #9E1116;
    --num: "DIN Alternate", "Bahnschrift", "Barlow Condensed", "Arial Narrow", sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #141413; --card: #1D1D1B; --ink: #F1EFE8; --ink-2: #C9C6BC; --ink-3: #9B988F; --rule: #34332F; --red: #E5484D; --red-dark: #C4161C; }
  }
  :root[data-theme="dark"] { --paper: #141413; --card: #1D1D1B; --ink: #F1EFE8; --ink-2: #C9C6BC; --ink-3: #9B988F; --rule: #34332F; --red: #E5484D; --red-dark: #C4161C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  header { border-bottom: 1px solid var(--rule); }
  header .wrap { display: flex; align-items: center; gap: 10px; height: 64px; font-weight: 700; }
  .mark { width: 22px; height: 22px; background: var(--ink); position: relative; flex: none; }
  .mark::after { content: ""; position: absolute; right: 0; bottom: 0; width: 9px; height: 9px; background: var(--red); }
  .hero { padding: 64px 0 40px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--red); margin: 0 0 14px; }
  h1 { font-size: 40px; line-height: 1.2; margin: 0 0 14px; letter-spacing: -.5px; }
  .lead { font-size: 17px; color: var(--ink-2); margin: 0; max-width: 36em; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding-bottom: 56px; }
  a.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--rule); padding: 24px; color: inherit; text-decoration: none; min-height: 220px; transition: border-color .15s; }
  a.card:hover { border-color: var(--ink); }
  a.card:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .tag { font-family: var(--mono); font-size: 12px; color: var(--ink-3); border: 1px solid var(--rule); padding: 2px 8px; align-self: flex-start; }
  .card h2 { font-size: 22px; margin: 18px 0 6px; }
  .card p { margin: 0; color: var(--ink-2); font-size: 15px; flex: 1; }
  .go { margin-top: 20px; font-weight: 700; color: var(--red); display: flex; justify-content: space-between; align-items: center; }
  .ver { font-family: var(--mono); font-size: 13px; color: var(--ink-3); font-weight: 400; }
  footer { border-top: 1px solid var(--rule); padding: 28px 0 40px; font-size: 13px; color: var(--ink-3); }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 32px; } .hero { padding: 40px 0 28px; } }
  @media (max-width: 480px) { .wrap { padding: 0 16px; } }
</style>
</head>
<body>
<header><div class="wrap"><span class="mark" aria-hidden="true"></span>Robbie's E-Ink Boards</div></header>
<main class="wrap">
  <div class="hero">
    <p class="eyebrow">固件安装</p>
    <h1>墨水屏看板</h1>
    <p class="lead">选择要安装的看板。首次在电脑上用 Chrome 或 Edge 通过 USB 安装一次，之后通过 Wi-Fi 自动升级。</p>
  </div>
  <div class="grid">
    <a class="card" href="/ESP32-EINK42-BWR-STOCK-OTA/" data-ver="/ESP32-EINK42-BWR-STOCK-OTA/version.txt">
      <span class="tag">4.2″ 黑白红</span>
      <h2>行情看板</h2>
      <p>上证、创业板、深证、恒生、纳指、道指六大指数轮播，涨红跌黑。</p>
      <span class="go">安装固件 →<span class="ver"></span></span>
    </a>
    <a class="card" href="/ESP32-EINK42-BW-WEATHER-OTA/" data-ver="/ESP32-EINK42-BW-WEATHER-OTA/version.txt">
      <span class="tag">4.2″ 黑白</span>
      <h2>天气看板</h2>
      <p>当前天气、体感湿度、风力、日出日落与未来 6 天预报。</p>
      <span class="go">安装固件 →<span class="ver"></span></span>
    </a>
    <a class="card" href="/ESP32-EINK42-BW-RECIPE-OTA/" data-ver="/ESP32-EINK42-BW-RECIPE-OTA/version.txt">
      <span class="tag">4.2″ 黑白</span>
      <h2>食谱看板</h2>
      <p>按星期自动显示当天午饭、晚饭、运动与血压打卡。</p>
      <span class="go">安装固件 →<span class="ver"></span></span>
    </a>
  </div>
</main>
<footer><div class="wrap">io.huwenhou.com</div></footer>
<script>
  document.querySelectorAll('a.card').forEach(function (a) {
    fetch(a.dataset.ver, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (v) { v = (v || '').trim(); if (v) a.querySelector('.ver').textContent = 'v' + v; })
      .catch(function () {});
  });
</script>
</body>
</html>
